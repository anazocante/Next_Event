<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL50,GRAD@20..48,100..700,50..1,-50..200&icon_names=person" />
    <title>Login | Next Events</title>
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html"><img src="logo.png" alt="Logo"></a>
        </div>

        <nav>
            <ul>
                <li><a href="fornecedores.html">Fornecedores</a></li>
                <li><a href="eventos.html">Site de Eventos</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
            </ul>
        </nav>

        <a href="login.html" class="login-section2">
            <section class="login-section">
                <span class="material-symbols-outlined" id="material-symbols-outlined">
                    person
                </span>
                <p class="entre">Entre</p>
            </section>
        </a>

    </header>

    <main>
        <div class="login-container">
            <h1 class="login-title">Bem vindo de volta</h1>
            <div class="acesso">
                <h3 id="login-subtitle">Acesse sua conta</h3>
                <h3 id="login-subtitle2"> agora mesmo</h3>
            </div>
        </div>

        <div class="login-form">
            <h1 class="login-form-title">Login</h1>

            <form action="index.html" method="POST">

                <div class="login-form-email">
                    <span class="material-symbols-outlined">
                        mail
                    </span>
                    <input type="email" id="email" name="email" required placeholder="Email">

                </div>

                <div class="login-form-password">
                    <span class="material-symbols-outlined">
                        lock_open
                    </span>
                    <input type="password" id="senha" name="senha" required placeholder="Senha">

                </div>
                <p class="login-form-link2"><a class="login-form-link" href="esqueceu-senha.html">Esqueceu a senha?</a>
                </p>

                <button class="login-button" type="submit"> <a class="login-button-link"
                        href="index.html">Entrar</a></button>
                <p class="login-form-text">Não possui uma conta ainda? <a class="login-form-text2"
                        href="cadastro.html">Cadastre-se já!</a></p>
            </form>

        </div>

    </main>

</body>

</html>
