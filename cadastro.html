<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL50,GRAD@20..48,100..700,50..1,-50..200&icon_names=person" />
    <title>Cadastro | Next Events</title>
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html"><img src="logo.png" alt="Logo"></a>
        </div>

        <nav>
            <ul>
                <li><a href="fornecedores.html">Fornecedores</a></li>
                <li><a href="eventos.html">Site de Eventos</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
            </ul>
        </nav>


        <a href="login.html" class="login-section2">
            <section class="login-section">
                <span class="material-symbols-outlined" id="material-symbols-outlined">
                    person
                </span>
                <p class="entre">Entre</p>
            </section>
        </a>
    </header>


    <main>
        <div class="cadastro-container">
            <h1 class="cadastro-title">Seja bem-vindo!</h1>
            <div class="acesso">
                <h3 id="cadastro-subtitle">Cadastre-se já para não</h3>
                <h3 id="cadastro-subtitle2"> ficar por fora de</h3>
                <h3 id="cadastro-subtitle3"> nenhuma novidade</h3>
            </div>
        </div>

        <div class="cadastro-form">
            <h1 class="cadastro-form-title">Cadastro</h1>

            <form action="login.html" method="POST">

                <div class="cadastro-form-username">
                    <span class="material-symbols-outlined">
                        person
                    </span>
                    <input type="text" id="username" name="username" required placeholder="Nome de usuário">

                </div>

                <div class="cadastro-form-telefone">
                    <span class="material-symbols-outlined">
                        mobile_2
                    </span>
                    <input type="tel" id="phone" name="phone" required placeholder="+55 (xx) xxxxx-xxxx">

                </div>

                <div class="cadastro-form-email">
                    <span class="material-symbols-outlined">
                        mail
                    </span>
                    <input type="email" id="email" name="email" required placeholder="Email">

                </div>

                <div class="cadastro-form-passwordC">
                    <span class="material-symbols-outlined">
                        lock_open
                    </span>
                    <input type="password" id="senhaC" name="senha" minlength="8" required placeholder="Crie sua senha">

                </div>

                <div class="cadastro-form-password">
                    <span class="material-symbols-outlined">
                        lock_open
                    </span>
                    <input type="password" id="senha" name="senha" minlength="8" required
                        placeholder="Confirme sua senha">

                </div>

                <div class="cadastro-form-terms">
                    <input type="checkbox">
                    <label class="termos-label"></label>
                    <span class="termos-text">
                        Li e aceito as <a class="politicapriv" href="#">Política de
                            Privacidade</a></span></label>
                </div>

                <button class="cadastro-form-button" type="submit"><a class="cadastro-button-link"
                        href="index.html">Cadastrar</a></button>
            </form>
        </div>
    </main>
</body>

</html>
