<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="esqueceu-senha.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL50,GRAD@20..48,100..700,50..1,-50..200&icon_names=person" />

    <title>Esqueceu a senha? | Next Events</title>
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html"><img src="logo.png" alt="Logo"></a>
        </div>

        <nav>
            <ul>
                <li><a href="fornecedores.html">Fornecedores</a></li>
                <li><a href="eventos.html">Site de Eventos</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
            </ul>
        </nav>


        <a href="login.html" class="login-section2">
            <section class="login-section">
                <span class="material-symbols-outlined" id="material-symbols-outlined">
                    person
                </span>
                <p class="entre">Entre</p>
            </section>
        </a>
    </header>


    <main>
        <div class="redefinir-container">
            <h1 class="redefinir-title">Esqueceu sua</h1>
            <h1 class="redefinir-title2">senha?</h1>
            <div class="acesso">
                <h3 id="redefinir-subtitle">Recupere-a agora</h3>
                <h3 id="redefinir-subtitle2">mesmo</h3>
            </div>
        </div>

        <div class="redefinir-form">
            <h1 class="redefinir-form-title">Recupere sua senha</h1>

            <form action="login.html" method="POST">

                <div class="redefinir-form-email">
                    <span class="material-symbols-outlined">
                        mail
                    </span>
                    <input type="email" id="email" name="email" required placeholder="Email">

                </div>

                <div class="redefinir-form-newpassword">
                    <span class="material-symbols-outlined">
                        lock_open
                    </span>
                    <input type="password" id="newsenha" name="newsenha" required placeholder="Nova senha">

                </div>

                <div class="redefinir-form-confirmpassword">
                    <span class="material-symbols-outlined">
                        lock_open
                    </span>
                    <input type="password" id="confirmsenha" name="confirmsenha" required
                        placeholder="Confirme sua senha">
                </div>

                <button class="redefinir-form-button" type="submit"><a class="redefinir-button-link"
                        href="login.html">Confirmar</a>
                </button>
            </form>

        </div>

    </main>

</body>

</html>
